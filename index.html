<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisione Apocalittica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0e15;--st1:#2c3850;--st2:#121926;--sil:#e6ebf3;--sil2:#a3aebf;--red:#e8372c;--cy:#2bb8ee;--yel:#ffd23f;--lil:#cdbcf2;--grn:#35c777;--blu:#3a7bd5;
--ff:"Segoe UI","Helvetica Neue",Arial,sans-serif;--fd:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ff);font-weight:600;color:#eef2f8;background:#1a2030;overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}

/* ---------- sfondo officina ---------- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#2a3140}
#stage>svg{width:100%;height:100%;display:block}
#stage .veil{position:absolute;inset:0;background:rgba(10,14,22,0);transition:background .55s,backdrop-filter .55s}
body[data-v=panel] #stage .veil{background:rgba(10,14,22,.66);backdrop-filter:blur(5px)}
body[data-v=title] #stage .veil{background:rgba(10,14,22,.38)}

/* ---------- pannelli (GT4 vetro/argento + contorno fumetto) ---------- */
.pn{position:relative;background:linear-gradient(180deg,rgba(48,63,88,.94),rgba(16,22,33,.96) 62%);border:3px solid var(--ink);border-radius:6px 22px 6px 22px;
box-shadow:0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.4),6px 6px 0 rgba(0,0,0,.5);overflow:hidden}
.pn::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.6px) 0 0/8px 8px}
.pn>*{position:relative}
.ph{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;background:linear-gradient(#f6f8fc,#b5bfcf 55%,#8f9bae);color:var(--ink);border-bottom:3px solid var(--ink);font:italic 800 17px var(--ff)}
.ph span{flex:1}.ph em{font-style:normal;font-weight:800;font-size:14px;background:var(--ink);color:#fff;padding:2px 10px;border-radius:10px}
.chip{width:26px;height:20px;background:var(--c,var(--red));border:3px solid var(--ink);transform:skewX(-14deg);flex:none}
.chip.cy{--c:var(--cy)}.chip.yl{--c:var(--yel)}.chip.li{--c:var(--lil)}

/* ---------- navigazione ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;gap:8px;padding:14px 20px;pointer-events:none}
.nav>div{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.tk{--c:var(--red);position:relative;font:italic 800 15px var(--ff);color:var(--ink);padding:9px 22px 8px;cursor:pointer;
background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0) 55%),var(--c);border:3px solid var(--ink);transform:skewX(-12deg);
box-shadow:4px 4px 0 rgba(0,0,0,.45);transition:transform .15s,filter .15s,box-shadow .15s}
.tk span{display:inline-block;transform:skewX(12deg)}
.tk.cy{--c:var(--cy)}.tk.yl{--c:var(--yel)}.tk.li{--c:var(--lil)}
.tk.red{color:#fff}.tk.red span{-webkit-text-stroke:.6px var(--ink);paint-order:stroke fill}
.nav .tk:not(.on){filter:saturate(.75) brightness(.86)}
.tk.on{transform:skewX(-12deg) translateY(-3px);box-shadow:0 0 0 2px #fff,5px 7px 0 rgba(0,0,0,.5)}
.tk:hover{filter:none;transform:skewX(-12deg) translateY(-2px)}
.dot{position:absolute;top:-9px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--red);border:3px solid var(--ink);transform:skewX(12deg)}
.menub{position:fixed;left:20px;bottom:18px;z-index:6}
.hud{position:fixed;right:20px;bottom:16px;z-index:6;width:min(330px,calc(100vw - 160px));padding:9px 14px 10px}
.hr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sil2)}
.hr b{color:#fff;font-weight:800}.hr span:first-child{color:#fff;font-weight:800}
.gauge{height:16px;margin:6px 0;background:#070a10;border:2px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
.gauge i{display:block;height:100%;transition:width .5s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 12px);mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 12px)}

/* ---------- home: garage ---------- */
.home{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:90px 16px 22px;cursor:pointer}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:center;width:max(320px,min(94vw,1060px,calc((100vh - 270px)*2.7)))}
.hero .cw{width:74%;flex:none}
.hero .own{width:15%;margin:0 2% 3% 0;flex:none}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:absolute;left:0;bottom:calc(100% - 30px);max-width:min(300px,58%);padding:12px 18px;background:#fff;color:var(--ink);border:4px solid var(--ink);
border-radius:50% 50% 50% 50%/62% 62% 38% 38%;font:italic 800 clamp(13px,1.6vw,17px)/1.2 var(--ff);text-align:center;box-shadow:5px 5px 0 rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:62%;bottom:-24px;width:26px;height:26px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:skewX(32deg) rotate(8deg) scaleY(.9);border-radius:0 0 8px 0}
.plate{margin-top:6px;padding:6px 26px;font:italic 800 16px var(--ff);color:#fff;background:linear-gradient(rgba(255,255,255,.18),rgba(0,0,0,.25)),var(--st2);border:3px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.3),4px 4px 0 rgba(0,0,0,.45);transform:skewX(-12deg)}
.plate span{display:inline-block;transform:skewX(12deg)}.plate em{font-style:normal;color:var(--cy);margin-left:10px}
.scroll{margin-top:16px;display:flex;flex-direction:column;align-items:center}
.sc-pl{padding:8px 24px;font:900 clamp(15px,2vw,20px) var(--fd);color:var(--ink);letter-spacing:.02em;background:
linear-gradient(rgba(11,14,21,.16) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(11,14,21,.16) 1px,transparent 1px) 0 0/12px 12px,var(--cy);
border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.5);transform:rotate(-2deg)}
.chev{display:block;margin-top:2px;width:28px;height:14px;animation:nudge 1.3s ease-in-out infinite}
.chev+.chev{margin-top:-6px;animation-delay:.15s}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}

/* ---------- schermate con pannelli ---------- */
.main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:88px 20px 130px;display:grid;grid-template-columns:1.08fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.col{display:grid;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.show{padding:10px 12px 0;background:radial-gradient(ellipse at 50% 92%,rgba(170,195,235,.5),transparent 62%)}
.show svg{width:100%;height:auto;display:block}
.show.lock .mk{pointer-events:none}
.mk{cursor:pointer}.mk:hover circle{stroke-width:6}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:4px 16px 12px}
.spec div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px}
.spec span{color:var(--sil2)}.spec b{font-weight:800}
.own{display:flex;gap:12px;padding:14px;align-items:center}
.av{width:56px;height:56px;flex:none;background:var(--cy);border:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.av::before{content:"";width:26px;height:26px;border-radius:50%;background:var(--ink);box-shadow:0 22px 0 8px var(--ink);margin-bottom:-4px;transform:translateY(-6px)}
.own b{font-size:17px;display:block}.own small{display:block;color:var(--sil2);font-size:13px}
.est{padding:12px 16px 14px}.est .big{font:italic 900 34px var(--fd);color:var(--yel);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);line-height:1.1}
.est small{display:block;color:var(--sil2);font-size:13px;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 60%);transition:background .15s}
.row:hover{background:linear-gradient(90deg,rgba(43,184,238,.3),transparent 85%)}
.n{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;font:900 14px var(--fd);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:50%}
.cb{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;font:900 18px var(--fd);background:#fff;color:var(--grn);border:3px solid var(--ink);-webkit-text-stroke:1px var(--ink)}
.t{flex:1;font-size:16px;font-weight:800}.t small{display:block;font-size:13px;color:var(--sil2);font-weight:600}
.empty{padding:22px 18px;color:var(--sil2);font-size:15px;line-height:1.4}
.tot{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;background:rgba(0,0,0,.22)}.tot b{color:var(--yel);font-weight:800}
.foot{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.18)}
.st{font:italic 800 12.5px var(--ff);padding:3px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);transform:skewX(-12deg)}
.st.bad{background:var(--red);color:#fff}.st.good{background:var(--grn)}.st.fix{background:var(--blu);color:#fff}
.btn{--c:var(--red);font:italic 800 15px var(--ff);padding:9px 22px;border:3px solid var(--ink);cursor:pointer;color:#fff;
background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 52%),var(--c);box-shadow:4px 4px 0 rgba(0,0,0,.5);transform:skewX(-10deg);
-webkit-text-stroke:.7px var(--ink);paint-order:stroke fill;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:skewX(-10deg) translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.btn.cy{--c:var(--cy)}.btn.ok{--c:var(--grn)}.btn.sm{font-size:13px;padding:6px 14px}.btn.big{font-size:21px;padding:12px 34px}
.btn:disabled{--c:#7b8494;cursor:not-allowed;box-shadow:none;opacity:.7;transform:skewX(-10deg)}
.msg{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.msg h4{margin:0 0 4px;font:italic 800 13px var(--ff);display:inline-block;padding:2px 12px;background:var(--lil);color:var(--ink);border:2px solid var(--ink);transform:skewX(-12deg)}
.msg.sys h4{background:var(--yel)}.msg p{margin:4px 0 0;font-size:15px;line-height:1.35}

/* ---------- titolo / risultati ---------- */
.ttl{position:relative;z-index:2;max-width:700px;margin:0 auto;padding:8vh 18px 40px;text-align:center}
.ttl .pn{padding:26px 26px 30px}
.logo{margin:0 0 14px;font:italic 900 clamp(34px,7vw,56px)/1 var(--fd);color:var(--yel);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:skewX(-6deg)}
.ttl p{font-size:16px;line-height:1.45;margin:10px auto;max-width:56ch}
.steps{text-align:left;max-width:52ch;margin:14px auto;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.35}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font:900 14px var(--fd);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:50%}
.keys{font-size:12.5px;color:var(--sil2);margin-top:12px;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:15px;margin:14px 0}
th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.2);text-align:left}th{color:var(--sil2);font-weight:700}td:last-child,th:last-child{text-align:right}
.stamp{display:inline-flex;flex-direction:column;align-items:flex-start;margin:8px 0 14px;transform:rotate(-3deg);animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp .s1{margin-left:-10px;padding:4px 18px;font:italic 800 20px var(--ff);color:#fff;background:var(--red);border:3px solid var(--ink);letter-spacing:.04em}
.stamp .s2{padding:2px 24px;font:italic 900 clamp(38px,9vw,60px)/1.1 var(--fd);color:var(--ink);background:var(--cy);border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.5);transform:skewX(-8deg)}
.stamp.bad .s1{background:var(--ink)}.stamp.bad .s2{background:var(--red);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes stamp{from{transform:rotate(-3deg) scale(2.3);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

/* ---------- modali (dado, menu) ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,14,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.md{text-align:center;width:min(460px,94vw);padding:0 0 20px}
.md .bd{padding:18px 20px 0}
.blob{display:inline-block;margin:0 0 14px;padding:16px 30px;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:58% 42% 55% 45%/48% 56% 44% 52%;box-shadow:5px 5px 0 rgba(0,0,0,.5);-webkit-text-stroke:.8px var(--ink);paint-order:stroke fill;transform:rotate(-2deg)}
.blob.rep{background:var(--cy);color:var(--ink);-webkit-text-stroke:0}
.blob b{display:block;font:italic 900 24px var(--fd)}.blob small{display:block;font-size:14px;font-weight:800}
.die{width:92px;height:92px;margin:0 auto;background:#fff;border:5px solid var(--ink);border-radius:16px;box-shadow:inset -9px -9px 0 #d4cdb8,6px 6px 0 rgba(0,0,0,.5);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px}
.die i{margin:3px}.die i.on{background:var(--ink);border-radius:50%}
.res{min-height:52px;font-size:16px;margin:14px 0;line-height:1.35}
.menulist{display:grid;gap:12px;padding:6px 24px 0;justify-items:center}
.help{font-size:13.5px;color:var(--sil2);line-height:1.5;padding:12px 24px 0;text-align:left}

@media(max-width:600px){.nav{padding:10px}.tk{padding:8px 13px 7px;font-size:13px}.menub{left:10px;bottom:12px}.hud{right:10px;bottom:10px}.main{padding-top:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== JRPG 16-bit ===== */
:root{--ink:#04051f;--sil2:#a9b4ee;--red:#ff6b6b;--cy:#8fc0ff;--yel:#ffd23f;--lil:#d6c8ff;--grn:#7dff9a;--blu:#8fc0ff;--ff:"DotGothic16","Courier New",monospace;--fd:"Press Start 2P","Courier New",monospace;--w1:#2f3ed8;--w2:#0a0e5c;--wb:#e4e9ff}
*{font-weight:400!important;font-style:normal!important;-webkit-text-stroke:0!important}
body{font-size:17px;text-shadow:2px 2px 0 #000}
.pxb{position:relative;display:block}
.pxc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
svg.px{position:relative}svg.px>*{visibility:hidden}svg.px>.mk{visibility:visible}
#stage .pxb{position:absolute;inset:0}#stage .pxc{object-fit:cover;object-position:50% 100%}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
body[data-v=panel] #stage .veil{background:rgba(4,5,31,.7);backdrop-filter:none}
.ov{backdrop-filter:none;background:rgba(0,0,20,.74)}
.pn{background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--wb);border-radius:8px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(0,0,0,.55),5px 5px 0 2px rgba(0,0,0,.5)}
.pn::before{display:none}
.ph{background:none;color:var(--yel);border-bottom:2px solid rgba(228,233,255,.4);font:400 .7rem/1.4 var(--fd);padding:12px 14px;text-shadow:2px 2px 0 #000}
.ph em{background:none;border:2px solid rgba(255,255,255,.45);border-radius:4px;color:#fff;font:400 .55rem var(--fd);padding:4px 8px}
.chip{width:12px;height:12px;transform:none;border:2px solid #000;border-radius:0}
.tk,.btn{font:400 .6rem/1.5 var(--fd);color:var(--c)!important;text-shadow:2px 2px 0 #000;transform:none!important;position:relative;padding:11px 14px 11px 28px;
 background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--wb);border-radius:8px;box-shadow:0 0 0 2px #000,4px 4px 0 2px rgba(0,0,0,.5)}
.tk span{transform:none}.tk.red{color:#fff!important}
.tk::before,.btn::before{content:"▶";position:absolute;left:10px;top:50%;margin-top:-.7em;color:var(--yel);opacity:0}
.tk:hover::before,.tk.on::before,.btn:hover:not(:disabled)::before{opacity:1;animation:nudge2 .5s steps(2) infinite}
@keyframes nudge2{50%{transform:translateX(4px)}}
.tk:hover,.tk.on,.btn:hover:not(:disabled){border-color:var(--yel);filter:none;box-shadow:0 0 0 2px #000,4px 4px 0 2px rgba(0,0,0,.5)}
.btn:active{margin:2px 0 0 2px}
.btn.sm{font-size:.52rem;padding:8px 10px 8px 22px}.btn.sm::before{left:6px}.btn.big{font-size:.78rem;padding:14px 20px 14px 32px}
.btn:disabled{--c:#6b7390;opacity:.6;filter:grayscale(1)}
.dot{transform:none;border-radius:0}
.st{transform:none;border-radius:3px;font:400 .5rem var(--fd);padding:5px 8px;border:2px solid #000}
.n,.cb{border-radius:4px;font-family:var(--fd);font-size:.6rem}
.est .big{font:400 1.4rem var(--fd);text-shadow:3px 3px 0 #000}
.logo{font:400 clamp(1.1rem,5vw,1.9rem)/1.6 var(--fd);transform:none;color:var(--yel);text-shadow:3px 3px 0 #1a1fa0,0 0 14px var(--cy)}
.steps li::before{border-radius:4px;font:400 .6rem var(--fd)}
.stamp .s1{font:400 .8rem var(--fd);border-radius:4px}.stamp .s2{font:400 clamp(1rem,5.5vw,1.9rem)/1.5 var(--fd);transform:none;border-radius:6px;border-color:var(--wb)}
.bubble{border-radius:8px;background:linear-gradient(var(--w1),var(--w2));color:#fff;border:3px solid var(--wb);box-shadow:0 0 0 2px #000,4px 4px 0 2px rgba(0,0,0,.5);font:400 clamp(13px,1.6vw,17px)/1.4 var(--ff);text-align:left;text-shadow:2px 2px 0 #000;padding:12px 28px 12px 14px}
.bubble::after{content:"▼";left:auto;right:10px;bottom:4px;width:auto;height:auto;background:none;border:0;transform:none;color:var(--yel);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.plate,.sc-pl{transform:none;font:400 .7rem var(--fd);background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--wb);border-radius:8px;box-shadow:0 0 0 2px #000,4px 4px 0 2px rgba(0,0,0,.5)}
.plate span{transform:none}.sc-pl{color:var(--yel);font-size:.62rem;animation:blink 1.2s steps(2) infinite}
.blob{border-radius:6px;background:rgba(0,0,0,.4);color:var(--yel);border:3px solid var(--wb);box-shadow:none;transform:none}.blob.rep{background:rgba(0,0,0,.4)}
.blob b{font:400 .8rem var(--fd)}.blob small{margin-top:8px;color:#fff}
.die{border-color:#000;border-radius:10px}
.gauge{border-color:var(--wb);background:#000}
.msg h4{transform:none;border-radius:3px;border-color:#000;font:400 .55rem var(--fd)}

/* ===== fix ombre testo scuro su fondo chiaro ===== */
body{text-shadow:1px 1px 0 rgba(0,0,0,.85)}
.st,.n,.cb,.msg h4,.stamp .s2,.steps li::before,.blob.rep,.die,.tot b{text-shadow:none}
.st.bad,.st.fix{text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.dif{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dh{font:400 .65rem var(--fd);color:var(--yel);margin:18px 0 4px}.dd{font-size:.95rem;color:var(--sil2);margin:6px 0}
.lore{position:fixed;inset:0;z-index:4;display:flex;align-items:flex-end;justify-content:center;padding:20px 16px 40px;cursor:pointer}
.lbox{width:min(760px,100%);padding:28px 22px 22px;min-height:160px;overflow:visible;text-align:left}
.who{position:absolute;top:-18px;left:18px;padding:7px 14px;font:400 .62rem var(--fd);color:var(--yel);background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--wb);border-radius:6px;box-shadow:0 0 0 2px #000}
.lbox p{margin:0;font-size:1.15rem;line-height:1.55;min-height:4.6em;text-align:left;max-width:none}
.more{position:absolute;right:16px;bottom:10px;color:var(--yel);animation:blink 1s steps(2) infinite}
.skip{position:absolute;top:18px;right:18px}

.mg .bd,.md .bd{padding:14px 18px 0}
.g2{position:relative;height:30px;background:#000;border:3px solid var(--wb);border-radius:4px;margin:14px 0 6px;overflow:hidden}
.g2 i{position:absolute;left:0;top:0;bottom:0;width:0;background-image:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.35) 8px 10px),linear-gradient(rgba(255,255,255,.3),transparent 55%)}
.g2 u{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 0 2px #000;transform:translateX(-2px)}
.g2 b{position:absolute;top:0;bottom:0;background:rgba(125,255,154,.4)}
.fv{font:400 .8rem var(--fd);color:var(--yel);margin:8px 0}
.mgbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.mgbtn .btn{width:auto;user-select:none;touch-action:none}
.nuts{position:relative;width:210px;height:210px;margin:10px auto;border-radius:50%;background:radial-gradient(#3a3f4f 0 38%,#14141a 40% 100%);border:4px solid #000}
.nut{position:absolute;width:44px;height:44px;margin:-22px;background:#cfd6e2;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);cursor:pointer;display:grid;place-items:center;transition:transform .25s,opacity .25s}
.nut::after{content:"";width:16px;height:16px;border-radius:50%;background:#555}
.nut.done{transform:rotate(180deg) scale(.1);opacity:0;pointer-events:none}.nut.hint{background:var(--yel)}
.cal{margin:14px 0;text-align:left}.cal label{display:flex;justify-content:space-between;font-size:.95rem}.cal input{width:100%;accent-color:#ffd23f}.cal b{font:400 .7rem var(--fd);color:var(--yel)}
.cb.on{background:var(--grn);border-color:#fff;box-shadow:0 0 0 2px #000}.cb svg{width:20px;height:20px}
.md.wide{width:min(640px,96vw)}.md .keys{padding:0 8px}
</style></head><body data-v="title">
<div id="stage"></div>
<div id="app"></div><div id="menu"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);

/* ======================= DATI ======================= */
const PARTS=[{n:'Motore',h:2,x:490,y:150,z:'Cofano e sotto il motore',mg:'Rabbocca l\'olio'},{n:'Radiatore',h:1,x:415,y:160,z:'Zona anteriore, sotto il cofano',mg:'Rabbocca il refrigerante'},{n:'Fari',h:1,x:548,y:170,z:'Fanale anteriore',mg:'Regola il fascio'},{n:'Freni',h:1.5,x:470,y:208,z:'Ruota anteriore',mg:'Rabbocca il liquido freni'},{n:'Gomme',h:1.5,x:140,y:208,z:'Ruote',mg:'Svita i dadi e gonfia'},{n:'Sospensioni',h:2,x:305,y:216,z:'Assetto dell\'auto',mg:'Tara l\'assetto'},{n:'Marmitta',h:1,x:62,y:186,z:'Scarico, parte posteriore',mg:'Svita le fascette'}];
const CARS=[
{m:'Fiat Panda',y:1998,km:212430,f:'Benzina',c:'#ffd23f',lim:8,n:3,own:{nome:'Paolo Muro',eta:33,job:'Tecnico',dest:'Città del Capo'},
 say:'Ripara la mia auto, che devo scappare!!!',note:'Il proprietario ha due gatti sul sedile e nessuna voglia di aspettare.'},
{m:'Alfa Romeo 147',y:2004,km:187900,f:'Diesel',c:'#e8372c',lim:10,n:4,own:{nome:'Giulia Ferrante',eta:41,job:'Infermiera',dest:'Durban'},
 say:'I cancelli chiudono all\'alba! Sbrigati!',note:'«I cancelli della città chiudono all\'alba. Fai in fretta.»'},
{m:'Land Rover Defender',y:2001,km:305120,f:'Diesel',c:'#43b86a',lim:12,n:5,own:{nome:'Marco Benedetti',eta:52,job:'Guida alpina',dest:'Windhoek'},
 say:'Il bagagliaio è pieno di scatolette. Muoviti!',note:'Bagagliaio pieno di scatolette. Il tizio guarda fuori dalla finestra ogni minuto.'}];
const FACES=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
let G={screen:'menu'};
const LV={easy:{n:'Facile',hm:1.3,tol:1.7,err:2,mg:3,so:1,hint:true,col:'cy',d:'Più tempo (+30%) · fino a 2 errori nel check-up · tolleranze larghe e aiuti'},
 norm:{n:'Normale',hm:1,tol:1,err:1,mg:2,so:.9,hint:false,col:'yl',d:'Ore standard · 1 errore ammesso nel check-up · tolleranze medie'},
 hard:{n:'Difficile',hm:.85,tol:.6,err:0,mg:1,so:.7,hint:false,col:'red',d:'Meno tempo (-15%) · nessun errore nel check-up · tolleranze strette, segnali più tenui'}};
let DIFF='norm';const lv=()=>LV[DIFF];
const rng=(a,b)=>a>=b?''+b:a+'-'+b;
function rules(buy){const b=lv().bad,g=lv().gen;return buy?`${rng(1,b)}: i predoni rubano il pezzo (-1h) · ${rng(b+1,6)}: acquisto riuscito (-1h)`:`${rng(1,b)}: imprevisto, +1h e ricambio perso · ${rng(b+1,g-1)}: riparato · ${rng(g,6)}: colpo di genio, -1h`}
function setDiff(k){DIFF=k;render()}
/* ---------- lore ---------- */
const LORE=[['Radio','📻','…bollettino straordinario. Il virus Z-9 ha superato il cordone sanitario. Da questa notte la città è dichiarata zona perduta.'],
['Radio','📻','Il Corridoio Sud, l\'unica via ancora aperta verso l\'Africa australe, chiuderà i cancelli all\'alba. Chi non passa… resta qui.'],
['Narratore','📖','Sei l\'ultimo meccanico con le luci ancora accese. L\'officina «Revisioni Rapide» era di tuo padre: oggi è l\'unico posto dove si può ottenere il bollino.'],
['Narratore','📖','Senza bollino di revisione, ai posti di blocco non si passa. Ogni auto va controllata, riparata e timbrata prima che il proprietario perda la pazienza.'],
['Vecchio Tonino','👴','Guarda bene l\'auto prima di toccarla: fumo, perdite, gomme a terra… ogni segno parla. Segna tutto sul foglio di check-up.'],
['Vecchio Tonino','👴','Se sbagli troppe voci, il bollino non lo do. Poi in officina: olio, liquidi, pressione e assetto… ogni errore costa tempo. Forza, tre auto in coda!']];
let TW=null;
function startLore(){G={screen:'lore',li:0};render()}
function typeLore(){clearInterval(TW);const el=$('#lt');if(!el)return;const t=LORE[G.li][2];let i=0;G.full=false;el.textContent='';TW=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(TW);G.full=true}},22)}
function loreNext(){if(G.screen!=='lore')return;if(!G.full){clearInterval(TW);$('#lt').textContent=LORE[G.li][2];G.full=true;return}
 if(++G.li>=LORE.length){clearInterval(TW);return newGame()}render()}
function toTitle(){G={screen:'menu'};closeMenu();render()}

const cur=()=>G.cars[G.i];
const fmt=x=>(+x).toFixed(1).replace('.0','').replace('.',',');

/* ======================= LOGICA ======================= */
const kind=c=>c.m.includes('Panda')?0:c.m.includes('147')?1:2;
const SPEC=[{oil:3,cool:4.5,fl:.5,bar:2.1},{oil:4.2,cool:6,fl:.5,bar:2.3},{oil:6,cool:9,fl:.6,bar:2.2}];
const fx=(v,st)=>(+v).toFixed(st.dec||0).replace('.',',');
function newGame(){
 G={screen:'game',i:0,tab:'home',menuOpen:false,log:[],logN:0,seenN:0,mg:null,vr:null,checked:false,note:'',timeout:false,res:[],
 cars:CARS.map(c=>{const ids=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,c.n),lim=Math.round(c.lim*lv().hm);
  return{...c,lim,left:lim,marks:Array(7).fill(false),st:PARTS.map((p,k)=>({insp:false,fault:ids.includes(k),has:false,fixed:false}))}})};
 cancelAnimationFrame(MGRAF);$('#modal').innerHTML='';log('Entra la prima auto. Il proprietario è nervoso.');closeMenu();render()}
function log(t){G.log.unshift(t);G.log=G.log.slice(0,8);G.logN++}
function spend(h){const c=cur();c.left=Math.max(0,+(c.left-h).toFixed(1));if(c.left<=0)G.timeout=true}
function lose(why){cancelAnimationFrame(MGRAF);G.screen='end';G.win=false;G.why=why;G.mg=null;G.vr=null;$('#modal').innerHTML='';render()}
function setTab(t){if(G.screen!=='game'||G.mg||G.vr)return;if(t===1&&!G.checked){G.note='Prima compila il foglio e premi Verifica.';t=0}G.tab=t;if(t==='msg')G.seenN=G.logN;render();scrollTo(0,0)}
function act(k){if(G.screen!=='game'||G.mg||G.vr)return;if(G.tab===0)mark(k);else if(G.tab===1)startRepair(k)}
/* --- check-up --- */
function mark(k){const c=cur();if(G.checked)return;c.marks[k]=!c.marks[k];render()}
function verify(){const c=cur();if(G.checked||G.mg||G.vr)return;
 const rows=PARTS.map((p,k)=>({p,mk:!!c.marks[k],f:c.st[k].fault})),errs=rows.filter(r=>r.mk!==r.f).length;
 G.vr={rows,errs,ok:errs<=lv().err};showVr()}
function showVr(){const v=G.vr;if(!v){$('#modal').innerHTML='';return}
 $('#modal').innerHTML=`<div class="ov"><div class="pn md"><div class="ph"><i class="chip ${v.ok?'cy':''}"></i><span>Esito check-up</span></div><div class="bd">${v.rows.map(r=>{const ok=r.mk===r.f;return`<div class="row"><div class="t">${r.p.n}</div><span class="st ${ok?'good':'bad'}">${ok?'CORRETTO':r.f?'GUASTO NON SEGNATO':'FALSO ALLARME'}</span></div>`}).join('')}
 <div class="res">${v.ok?`Errori: ${v.errs} (massimo ${lv().err}). Check-up superato!`:`Errori: ${v.errs}, troppi (massimo ${lv().err}).`}</div><button class="btn big ${v.ok?'ok':''}" onclick="vrNext()">${v.ok?'Vai in officina':'Continua'}</button></div></div></div>`}
function vrNext(){const v=G.vr;if(!v)return;G.vr=null;showVr();
 if(!v.ok)return lose(`Revisione bocciata: hai sbagliato ${v.errs} voci del check-up (massimo ${lv().err}). Il proprietario ha cambiato officina.`);
 const c=cur();G.checked=true;G.note='';c.st.forEach(x=>x.insp=true);log(`Check-up superato con ${v.errs} errori. Guasti da riparare: ${c.st.filter(x=>x.fault).length}.`);setTab(1)}
/* --- minigiochi --- */
let MGRAF=0,MGT=0;
function mkSteps(k,c){const sp=SPEC[kind(c)],t=lv().tol,rn=(a,b)=>a+rnd(b-a+1),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 const fill=o=>Object.assign({t:'fill',fast:.28,slow:.08,dec:1},o,{v:o.s0});
 if(k===0){const w=rn(20,26)+(t>1?10:t<1?-4:0),mn=rn(34,44);return[{t:'oil',dyn:1,title:'Rabbocca l\'olio a occhio',sub:'Versa senza vedere il livello, poi controlla con l\'astina',l0:rn(12,30),mn,mx:mn+w,rate:rn(55,80)/10,ph:Math.random()*6.28}]}
 if(k===1){const h=.08*t,c=rn(48,72)/100;return[{t:'cool',dyn:1,title:'Rabbocca il refrigerante',sub:'Fai scoppiare le bolle d\'aria che bloccano il flusso',lo:c-h,hi:c+h,t0:rn(8,18)/100,sr:t>1?1.3:t<1?.8:1}]}
 if(k===3)return[{t:'brake',dyn:1,title:'Spurgo e liquido freni',sub:'Pompa a ritmo il pedale mentre versi il liquido nuovo',beat:rn(62,92)/100,safe:rn(30,40)/100,r0:rn(55,70)/100}];
 if(k===2){const tg=(rn(0,20)-10)/10;return[{t:'calib',title:'Regola il fascio dei fari',dec:1,items:[{lab:'Inclinazione',unit:'°',min:-3,max:3,step:.1,target:tg,tol:.3*t,s0:cl(tg+(rnd(2)?2:-2),-3,3)}]}]}
 if(k===5){const f=rn(150,190),r=f+rn(0,12);return[{t:'calib',title:'Tara l\'assetto',dec:0,items:[{lab:'Altezza anteriore',unit:' mm',min:120,max:220,step:1,target:f,tol:4*t,s0:f+(rnd(2)?28:-28)},{lab:'Altezza posteriore',unit:' mm',min:120,max:220,step:1,target:r,tol:4*t,s0:r+(rnd(2)?-30:30)}]}]}
 if(k===4)return[{t:'bolts',title:'Svita i dadi a stella',n:5,order:[0,2,4,1,3],next:0,mist:0,done:[]},fill({title:'Gonfia lo pneumatico',unit:'bar',max:4,target:sp.bar,tol:.1*t,s0:.3,col:'#9fd0ff',dec:2,fast:.3,slow:.1})];
 if(k===6)return[rnd(2)?{t:'weld',dyn:1,title:'Salda la crepa della marmitta',sub:'Mantieni una velocità costante: né troppo lenta né troppo veloce',amp:rn(8,22),f:.02+rnd(20)/1000,ph:Math.random()*6.28}:{t:'tape',dyn:1,title:'Fascia la marmitta arrugginita',sub:'Ruota il tubo e guida il rocchetto: giri leggermente sovrapposti, nessun buco',wt:rn(40,52)}];
 return[]}
function startRepair(k){const c=cur(),s=c.st[k];if(!G.checked||!s.fault||s.fixed)return;
 const steps=mkSteps(k,c);steps.forEach(st=>{st.m0=JSON.stringify(st)});G.mg={k,steps,i:0,hold:0,msg:''};showMg()}
function resetStep(st){const o=JSON.parse(st.m0);Object.keys(o).forEach(x=>{if(x!=='m0')st[x]=o[x]})}
function showMg(){GEN++;const m=G.mg;if(!m){$('#modal').innerHTML='';cancelAnimationFrame(MGRAF);return}
 if(m.steps[m.i].dyn){showDyn(m,m.steps[m.i],PARTS[m.k]);return}
 const st=m.steps[m.i],p=PARTS[m.k];let body='',btn='';
 if(st.t==='fill'){body=`<div class="g2"><i id="fb" style="background-color:${st.col}"></i>${lv().hint?`<b style="left:${(st.target-st.tol)/st.max*100}%;width:${2*st.tol/st.max*100}%"></b>`:''}<u style="left:${st.target/st.max*100}%"></u></div><div class="fv" id="fv"></div>`;
  btn=`<button class="btn" onpointerdown="mgHold(1)" onpointerup="mgHold(0)" onpointerleave="mgHold(0)" onpointercancel="mgHold(0)">${m.k===4?'Gonfia':'Versa'}</button><button class="btn cy" onpointerdown="mgHold(-1)" onpointerup="mgHold(0)" onpointerleave="mgHold(0)" onpointercancel="mgHold(0)">${m.k===4?'Sgonfia':'Scarica'}</button><button class="btn ok" onclick="mgConfirm()">Conferma</button>`}
 else if(st.t==='calib'){body=st.items.map((x,j)=>`<div class="cal"><label><span>${x.lab}</span><b id="cv${j}"></b></label><input type="range" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.v??x.s0}" oninput="mgSlide(${j},this.value)"></div>`).join('');btn=`<button class="btn ok" onclick="mgConfirm()">Conferma</button>`}
 else{body=`<div class="nuts">${[...Array(st.n)].map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/st.n;return`<div class="nut ${st.done.includes(i)?'done':''} ${lv().hint&&i===st.order[st.next]?'hint':''}" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%" onclick="mgNut(${i})"></div>`}).join('')}</div>`}
 const note=st.t==='fill'?`Libretto: ${fx(st.target,st)} ${st.unit} · tieni premuto, rilascia, poi conferma`:st.t==='calib'?'Libretto: '+st.items.map(x=>`${x.lab.toLowerCase()} ${fx(x.target,st)}${x.unit}`).join(' · '):'Segui lo schema a stella: salta un dado ogni volta';
 $('#modal').innerHTML=`<div class="ov"><div class="pn md mg"><div class="ph"><i class="chip yl"></i><span>${p.n}${m.steps.length>1?` · ${m.i+1}/${m.steps.length}`:''}</span></div><div class="bd"><div class="blob rep"><b>${st.title}</b><small>${note}</small></div>${body}<div class="res">${m.msg||''}</div><div class="mgbtn">${btn}</div><div class="keys">Tempo residuo: ${fmt(cur().left)}h · Spazio: versa · Invio: conferma</div></div></div></div>`;
 mgUpd();cancelAnimationFrame(MGRAF);MGT=performance.now();MGRAF=requestAnimationFrame(mgLoop)}
function mgUpd(){const m=G.mg;if(!m)return;const st=m.steps[m.i];
 if(st.t==='fill'){const b=$('#fb'),v=$('#fv');if(b)b.style.width=st.v/st.max*100+'%';if(v)v.textContent=`${fx(st.v,st)} ${st.unit}`}
 else if(st.t==='calib')st.items.forEach((x,j)=>{const e=$('#cv'+j);if(e){const v=x.v??x.s0;e.textContent=fx(v,st)+x.unit+(lv().hint&&Math.abs(v-x.target)<=x.tol?' ✓':'')}})}
function mgLoop(t){const m=G.mg;if(!m)return;const st=m.steps[m.i],dt=Math.min(.05,(t-MGT)/1000);
 if(st.dyn&&X.d){const g=GEN;X.d.upd(dt);if(g!==GEN)return;X.d.draw()}
 else if(st.t==='fill'&&m.hold){st.v=Math.max(0,Math.min(st.max,st.v+m.hold*(m.hold>0?st.fast:st.slow)*st.max*dt));mgUpd()}
 MGT=t;MGRAF=requestAnimationFrame(mgLoop)}
function mgHold(v){if(G&&G.mg)G.mg.hold=v}
function mgSlide(j,v){const st=G.mg.steps[G.mg.i];st.items[j].v=+v;mgUpd()}
function mgNut(i){const m=G.mg,st=m.steps[m.i];if(i===st.order[st.next]){st.done.push(i);st.next++;if(st.next>=st.n)return mgPass();m.msg='';showMg()}
 else{st.mist++;if(st.mist>lv().mg)return mgFail('Troppi dadi svitati nell\'ordine sbagliato.');m.msg=`Ordine sbagliato! (${st.mist}/${lv().mg+1})`;showMg()}}
function mgConfirm(){const m=G.mg;if(!m)return;const st=m.steps[m.i];let ok;
 if(st.t==='fill')ok=Math.abs(st.v-st.target)<=st.tol;else if(st.t==='calib')ok=st.items.every(x=>Math.abs((x.v??x.s0)-x.target)<=x.tol);else return;
 ok?mgPass():mgFail(st.t==='fill'?`Hai messo ${fx(st.v,st)} ${st.unit}: il libretto dice ${fx(st.target,st)}.`:'Valori fuori tolleranza.')}
function mgPass(){const m=G.mg;if(!m)return;m.hold=0;m.i++;m.msg='';if(m.i>=m.steps.length)return mgDone();showMg()}
function mgFail(msg){const m=G.mg;if(!m)return;m.hold=0;spend(1);log(`${PARTS[m.k].n}: errore, +1h persa.`);
 if(G.timeout)return lose('Il tempo è finito: il proprietario è scappato a piedi.');
 resetStep(m.steps[m.i]);m.msg=msg+' Perdi 1h: riprova.';showMg()}
function mgDone(){const m=G.mg;if(!m)return;const c=cur(),p=PARTS[m.k];spend(p.h);c.st[m.k].fixed=true;log(`${p.n}: riparato (${fmt(p.h)}h).`);G.mg=null;showMg();
 if(G.timeout)return lose('Il tempo è finito: il proprietario è scappato a piedi.');render()}
function mgKey(e,k){if(G.vr){if(k==='enter'||k===' '){e.preventDefault();vrNext()}return}
 const st=G.mg&&G.mg.steps[G.mg.i];if(!st)return;if(st.dyn){if(k.startsWith('arrow')||k===' '||k==='enter')e.preventDefault();X.k[k]=true;if(!e.repeat&&X.d.press)X.d.press(k);return}
 if(k==='enter'){e.preventDefault();mgConfirm()}else if(k===' '&&st.t==='fill'){e.preventDefault();G.mg.hold=1}}
addEventListener('focusin',e=>{if(G.mg&&e.target.tagName==='BUTTON'&&e.target.closest('#modal'))e.target.blur()});
addEventListener('keyup',e=>{if(e.key===' '&&G.mg)G.mg.hold=0;if(X&&X.k)X.k[e.key.toLowerCase()]=false});
function deliver(){const c=cur();if(G.screen!=='game'||G.mg||G.vr||!G.checked)return;if(!c.st.every(s=>!s.fault||s.fixed))return;G.res.push({m:c.m,left:c.left});G.screen='inter';render()}
function next(){if(G.i+1>=G.cars.length){G.screen='end';G.win=true;return render()}
 G.i++;G.tab='home';G.checked=false;G.note='';G.timeout=false;log(`Entra: ${cur().m}.`);G.screen='game';render()}

/* ======================= MINIGIOCHI DINAMICI ======================= */
let X={k:{}},GEN=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const cvHTML='<canvas id="cv" width="560" height="250" style="width:100%;display:block;border:3px solid #e4e9ff;border-radius:6px;background:#0b0e1c;touch-action:none;cursor:crosshair"></canvas>';
const say=s=>{const e=$('#rs');if(e)e.textContent=s};
const T_=(c,s,x,y,col,sz,al)=>{c.fillStyle=col||'#fff';c.font=(sz||13)+'px DotGothic16,monospace';c.textAlign=al||'left';c.fillText(s,x,y)};
const bar=(c,x,y,w,h,f,col)=>{c.fillStyle='#000';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle='#1b2038';c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(f,0,1),h)};
const holdBtn=l=>`<button class="btn" onpointerdown="X.btnp=1" onpointerup="X.btnp=0" onpointerleave="X.btnp=0" onpointercancel="X.btnp=0">${l}</button>`;
const MGX={};

/* ---- saldatura ---- */
MGX.weld={hint:'Mouse: tieni il cursore davanti alla fiamma (più è lontano, più va veloce) · Tastiera: → accelera, ← frena',
 init(){Object.assign(X,{x:40,v:0,kv:0,heat:0,go:0,pi:-1,sg:Array(48).fill(0),ag:[],sp:[]})},
 cy(s,x){return 125+s.amp*Math.sin(x*s.f+s.ph)},
 upd(dt){const x=X,s=x.st,tl=lv().tol,lo=70-25*tl,hi=70+25*tl;x.t+=dt;

 return`<g><circle cx="${x}" cy="${y}" r="${r+7}" fill="#0a0a14"/><circle cx="${x}" cy="${y}" r="${r}" fill="#2b2622" stroke="${INK}" stroke-width="6"/>${tr?`<circle cx="${x}" cy="${y}" r="${r-5}" fill="none" stroke="#000" stroke-width="5" stroke-dasharray="7 6" opacity=".7"/>`:''}<circle cx="${x}" cy="${y}" r="${(r*.58).toFixed(1)}" fill="${rim}" stroke="${INK}" stroke-width="4"/>${q?`<path d="${q}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`:''}<circle cx="${x}" cy="${y}" r="${(r*.16).toFixed(1)}" fill="${INK}"/></g>`}
function carSVG(c,mode){
 const D=CD[c.m.includes('Panda')?0:c.m.includes('147')?1:2];
 const A0=ANCH[CD.indexOf(D)],MP=[[430,-40],[512,-40],[598,40],[470,292],[140,292],[305,292],[40,292]],TG=[[A0.hx,A0.hy],[A0.hx+58,A0.hy],A0.hl,[470,D.wy],[140,D.wy],[305,D.mk[5]?D.mk[5][1]-6:218],D.mk[6]?[D.mk[6][0],D.mk[6][1]-6]:[62,186]];
 const mk=mode==='home'?'':PARTS.map((p,k)=>{const s=c.st[k],q=MP[k],g=TG[k],col=G.checked?(s.fixed?'#3a7bd5':s.fault?'#e8372c':'#35c777'):(c.marks[k]?'#e8372c':'#ffd23f'),ln=`M${q[0]} ${q[1]}L${g[0]} ${g[1]}`;
  return`<g class="mk" onclick="act(${k})"><title>${p.n}</title><path d="${ln}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="${ln}" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="${g[0]}" cy="${g[1]}" r="7" fill="${col}" stroke="${INK}" stroke-width="4"/><circle cx="${q[0]}" cy="${q[1]}" r="15" fill="${col}" stroke="${INK}" stroke-width="4"/><text x="${q[0]}" y="${q[1]+6}" text-anchor="middle" font-size="17" fill="${col==='#ffd23f'||col==='#35c777'?INK:'#fff'}" font-family="Arial Black">${k+1}</text></g>`}).join('');
 const A=ANCH[CD.indexOf(D)],f=k=>c.st[k].fault&&!c.st[k].fixed,pf=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;
 const tilt=f(5)?' transform="rotate(-2.8 305 225)"':'',flat=f(4)?' transform="translate(140 249) scale(1.14 .8) translate(-140 -249)"':'';
 let sg='';
 if(f(0))sg+=`<g fill="#5a5a66" opacity=".85">${pf(A.hx,A.hy-12,13)}${pf(A.hx+20,A.hy-34,17)}${pf(A.hx-4,A.hy-58,14)}</g><path d="M${A.hx-95} 212V242" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M${A.hx-95} 212V242" stroke="#ffb400" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 7"/><ellipse cx="${A.hx-95}" cy="252" rx="26" ry="7" fill="#3b2410" stroke="#ffb400" stroke-width="3"/><ellipse cx="${A.hx-100}" cy="250" rx="10" ry="2" fill="#ffd54a"/>`;
 if(f(1))sg+=`<g fill="#fff" opacity=".8">${pf(A.hx+58,A.hy-12,12)}${pf(A.hx+72,A.hy-32,15)}${pf(A.hx+56,A.hy-54,12)}</g><ellipse cx="540" cy="250" rx="30" ry="6" fill="#2fd37a" stroke="${INK}" stroke-width="3"/><path d="M538 214V240" stroke="#2fd37a" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 7"/>`;
 if(f(2))sg+=`<ellipse cx="${A.hl[0]}" cy="${A.hl[1]}" rx="13" ry="12" fill="#4b4f5a" opacity=".8"/><path d="M${A.hl[0]-8} ${A.hl[1]-10}l6 8-5 5 7 9" stroke="#fff" stroke-width="2.5" fill="none"/>`;
 if(f(3))sg+=`<circle cx="470" cy="${D.wy}" r="${D.wr*.55}" fill="#ff7a1a" opacity=".75" stroke="#ffd23f" stroke-width="3"/><g fill="#777" opacity=".8">${pf(470,D.wy-D.wr-12,10)}${pf(486,D.wy-D.wr-30,13)}</g>`;
 if(f(6))sg+=`<g fill="#14141a" opacity=".9">${pf(30,238,11)}${pf(14,222,13)}${pf(30,204,12)}${pf(12,186,10)}</g>`;
 sg=`<g opacity="${lv().so}">${sg}</g>`;
 const smoke=mode==='home'&&0?`<g fill="#4a4a55" stroke="${INK}" stroke-width="4" opacity=".9"><circle cx="500" cy="52" r="12"/><circle cx="520" cy="30" r="16"/><circle cx="502" cy="4" r="12"/></g>`:'';
 return`<svg viewBox="${mode==='home'?'0 -30 620 300':'0 -62 620 372'}"><defs><path id="bd" d="${D.d}"/><clipPath id="cp"><use href="#bd"/></clipPath><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
 <ellipse cx="310" cy="251" rx="290" ry="10" fill="${INK}" opacity=".45"/>
 <g${tilt}><use href="#bd" fill="${c.c}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><g clip-path="url(#cp)">${D.clip}<rect x="0" y="-30" width="620" height="110" fill="url(#cg)"/></g>${D.det}</g>
 <g${flat}>${wheel(140,D.wy,D.wr,D.rim,D.sp,D.tr)}</g>${wheel(470,D.wy,D.wr,D.rim,D.sp,D.tr)}${sg}${mk}</svg>`}

/* ======================= RENDER ======================= */
function nav(){
 const T=(id,label,cls)=>{const a=typeof id==='number'?id:`'${id}'`;
  return`<button class="tk ${cls} ${G.tab===id?'on':''}" onclick="setTab(${a})"><span>${label}</span>${id==='msg'&&G.logN>G.seenN&&G.tab!=='msg'?'<i class="dot"></i>':''}</button>`};
 return`<nav class="nav"><div>${T(0,'Check-up','')}${T(1,'Officina','yl')}</div><div>${T('msg','Messaggi','li')}</div></nav>`}
function hud(c){const pct=c.left/c.lim*100,col=pct>50?'#35c777':pct>25?'#ffd23f':'#e8372c';
 return`<div class="hud pn"><div class="hr"><span>Auto ${G.i+1}/${G.cars.length} · ${lv().n}</span><span>${c.m}</span></div><div class="gauge"><i style="width:${pct}%;background:${col}"></i></div><div class="hr"><span style="color:var(--sil2);font-weight:600">Tempo residuo</span><b>${fmt(c.left)}h / ${c.lim}h</b></div></div>`}
const menuBtn='<button class="tk red menub" onclick="openMenu()"><span>Menù</span></button>';
const CK='<svg viewBox="0 0 24 24"><path d="M3 13l6 6L21 5" fill="none" stroke="#04051f" stroke-width="5" stroke-linecap="square"/></svg>';
const pill=(s)=>`<span class="st ${s.fixed?'fix':s.fault?'bad':'good'}">${s.fixed?'RIPARATO':s.fault?'GUASTO':'OK'}</span>`;

function render(){render0();pixAll();if(G.screen==='lore')typeLore()}
function render0(){
 const A=$('#app');
 document.body.dataset.v=G.screen==='game'?(G.tab==='home'?'home':'panel'):(G.screen==='menu'?'title':'title');

 if(G.screen==='lore'){const l=LORE[G.li];A.innerHTML=`<div class="lore" onclick="loreNext()"><div class="pn lbox"><div class="who">${l[1]} ${l[0]}</div><p id="lt"></p><span class="more">▼</span></div><button class="btn sm skip" onclick="event.stopPropagation();clearInterval(TW);newGame()">Salta</button></div>`;return}
 if(G.screen==='menu'){A.innerHTML=`<div class="ttl"><div class="pn"><h1 class="logo">REVISIONE<br>APOCALITTICA</h1>
 <p>Una pandemia sta facendo crollare tutto. Sei l'ultimo meccanico ancora aperto e la fila di chi scappa si allunga.</p>
 <ol class="steps"><li>Osserva l'auto: fumo, perdite, gomme a terra… segna le parti guaste sul foglio e premi Verifica.</li><li>Se sbagli troppe voci, la revisione è bocciata.</li><li>Ripara ogni guasto con i minigiochi: dadi, liquidi, pressione, assetto.</li></ol>
 <p>Finisci prima che il proprietario scappi. Tre auto in coda.</p><h3 class="dh">Difficoltà</h3><div class="dif">${Object.entries(LV).map(([k,v])=>`<button class="tk ${v.col} ${k===DIFF?'on':''}" onclick="setDiff('${k}')"><span>${v.n}</span></button>`).join('')}</div><p class="dd">${lv().d}</p><button class="btn big" onclick="startLore()">Inizia</button><div class="keys">Premi Invio per iniziare</div></div></div>`+menuBtn;return}

 if(G.screen==='inter'){const r=G.res[G.res.length-1];A.innerHTML=`<div class="ttl"><div class="pn"><div class="stamp"><span class="s1">REVISIONE</span><span class="s2">PASSATA</span></div>
 <p>Hai riparato la macchina in tempo. ${r.m}: timbro sul libretto con ${fmt(r.left)}h di anticipo. Il proprietario parte sgommando.</p><button class="btn big ok" onclick="next()">Prossima auto</button><div class="keys">Premi Invio per continuare</div></div></div>`+menuBtn;return}

 if(G.screen==='end'){A.innerHTML=(G.win?`<div class="ttl"><div class="pn"><h1 class="logo">FATTO!</h1><p>Tutte le auto in coda hanno passato la revisione. Poi spegni le luci e chiudi l'officina.</p>
 <table><tr><th>Auto</th><th>Ore avanzate</th></tr>${G.res.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.left)}h</td></tr>`).join('')}</table><button class="btn big" onclick="toTitle()">Rigioca</button><div class="keys">Premi Invio per rigiocare</div></div></div>`
 :`<div class="ttl"><div class="pn"><div class="stamp bad"><span class="s1">REVISIONE</span><span class="s2">FALLITA</span></div><p>${G.why}</p><p>Il cliente è scappato a piedi. Auto superate: ${G.res.length} su ${CARS.length}.</p><button class="btn big" onclick="toTitle()">Rigioca</button><div class="keys">Premi Invio per rigiocare</div></div></div>`)+menuBtn;return}

 const c=cur(),o=c.own;
 /* ---------- garage (home) ---------- */
 if(G.tab==='home'){
  A.innerHTML=nav()+`<div class="home" onclick="setTab(0)"><div class="hero"><div class="bubble">${c.say}</div><div class="own">${figSVG()}</div><div class="cw">${carSVG(c,'home')}</div></div>
  <div class="plate"><span>${c.m}<em>${c.y}</em></span></div>
  <div class="scroll"><div class="sc-pl">SCORRI PER INIZIARE</div><svg class="chev" viewBox="0 0 28 14"><path d="M2 2l12 10L26 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="chev" viewBox="0 0 28 14"><path d="M2 2l12 10L26 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`+menuBtn+hud(c);return}

 /* ---------- schede ---------- */
 const faults=PARTS.map((p,k)=>({p,k,s:c.st[k]})).filter(x=>x.s.fault),todo=faults.filter(x=>!x.s.fixed),workH=todo.reduce((a,x)=>a+x.p.h,0),allFixed=G.checked&&!todo.length,nm=c.marks.filter(Boolean).length;
 const left=`<div class="col"><section class="pn"><header class="ph"><i class="chip"></i><span>${c.m}</span><em>${c.y}</em></header>
 <div class="show ${G.tab==='msg'?'lock':''}">${carSVG(c,'tab')}</div>
 <div class="spec"><div><span>Km</span><b>${c.km.toLocaleString('it-IT')}</b></div><div><span>Carburante</span><b>${c.f}</b></div><div><span>Segnati</span><b>${nm}/7</b></div><div><span>Guasti</span><b>${G.checked?faults.length:'?'}</b></div></div></section>
 <div class="two"><section class="pn"><header class="ph"><i class="chip cy"></i><span>Proprietario</span></header><div class="own"><div class="av"></div><div><b>${o.nome}</b><small>${o.eta} anni · ${o.job}</small><small>Destinazione: ${o.dest}</small></div></div></section>
 <section class="pn"><header class="ph"><i class="chip yl"></i><span>Stima lavori</span></header><div class="est"><div class="big">${G.checked?fmt(workH)+'h':'—'}</div><small>${G.checked?`${todo.length} riparazioni da fare`:'Compila il check-up'}</small></div></section></div></div>`;
 let title,chip,body,foot='';
 if(G.tab===0){title='Foglio di check-up';chip='';
  body=`<div class="empty">${G.checked?'Check-up superato. Ora vai in officina a riparare.':G.note||'Osserva l\'auto: fumo, perdite, gomme a terra, fari e assetto. Segna le parti che sembrano guaste (anche cliccando i numeri sull\'auto), poi premi Verifica.'}</div>`+
   PARTS.map((p,k)=>`<div class="row" style="cursor:pointer" onclick="act(${k})"><div class="n">${k+1}</div><div class="t">${p.n}<small>${p.z}</small></div>${G.checked?pill(c.st[k]):`<div class="cb ${c.marks[k]?'on':''}">${c.marks[k]?CK:''}</div>`}</div>`).join('');
  foot=G.checked?`<button class="btn" style="--c:var(--yel)" onclick="setTab(1)">Vai in officina</button>`:`<button class="btn ok" onclick="verify()">Verifica</button>`}
 else if(G.tab===1){title='Officina · Riparazioni';chip='yl';
  body=G.checked?(faults.length?faults.map(({p,k,s})=>`<div class="row"><div class="cb ${s.fixed?'on':''}">${s.fixed?CK:''}</div><div class="t">${p.n}<small>${p.mg} · ${fmt(p.h)}h</small></div>${s.fixed?'<span class="st fix">RIPARATO</span>':`<button class="btn sm ok" onclick="act(${k})">Ripara</button>`}</div>`).join('')+`<div class="tot"><span>Lavori residui</span><b>${fmt(workH)}h / ${fmt(c.left)}h</b></div>`:'<div class="empty">Nessun guasto.</div>'):'<div class="empty">Compila e verifica prima il check-up.</div>';
  foot=`<button class="btn cy" onclick="setTab(0)">Check-up</button><button class="btn ok" ${allFixed?'':'disabled'} onclick="deliver()">Consegna auto</button>`}
 else{title='Messaggi';chip='li';
  body=`<div class="msg"><h4>${o.nome}</h4><p>${c.note}</p></div>`+G.log.map(l=>`<div class="msg sys"><h4>Officina</h4><p>${l}</p></div>`).join('')}
 A.innerHTML=nav()+`<div class="main">${left}<section class="pn"><header class="ph"><i class="chip ${chip}"></i><span>${title}</span></header>${body}${foot?`<div class="foot">${foot}</div>`:''}</section></div>`+menuBtn+hud(c);
}

/* ======================= INPUT ======================= */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='escape'){if(G.menuOpen)closeMenu();else openMenu();return}
 if(G.menuOpen)return;
 if(G.mg||G.vr){mgKey(e,k);return}

 if(G.screen==='lore'){if(k==='enter'||k===' '){e.preventDefault();loreNext()}return}
 if(G.screen==='menu'||G.screen==='end'){if(k==='enter')G.screen==='menu'?startLore():toTitle();return}
 if(G.screen==='inter'){if(k==='enter')next();return}
 if(G.tab==='home'){if(k==='enter'||k===' '||k==='arrowdown'){e.preventDefault();setTab(0)}else if(k==='c'||k==='m'||k==='o')setTab(({c:0,o:1,m:'msg'})[k]);return}
 if(k==='c'||k==='m'||k==='o')setTab(({c:0,o:1,m:'msg'})[k]);
 else if(k==='h')setTab('home');
 else if(k==='d')deliver();
 else if(/^[1-7]$/.test(k))act(+k-1)});
let wheelLock=0,ty=null;
addEventListener('wheel',e=>{if(G.screen==='game'&&G.tab==='home'&&!(G.mg||G.vr)&&!G.menuOpen&&e.deltaY>10&&Date.now()>wheelLock){wheelLock=Date.now()+600;setTab(0)}},{passive:true});
addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(ty!==null&&G.screen==='game'&&G.tab==='home'&&!(G.mg||G.vr)&&!G.menuOpen&&ty-e.changedTouches[0].clientY>40)setTab(0);ty=null},{passive:true});

$('#stage').innerHTML=bgSVG()+'<div class="veil"></div>';
render();
</script></body></html>
