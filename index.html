<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisione Apocalittica</title>
<style>
:root{--ink:#0b0e15;--st1:#2c3850;--st2:#121926;--sil:#e6ebf3;--sil2:#a3aebf;--red:#e8372c;--cy:#2bb8ee;--yel:#ffd23f;--lil:#cdbcf2;--grn:#35c777;--blu:#3a7bd5;
--ff:"Segoe UI","Helvetica Neue",Arial,sans-serif;--fd:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ff);font-weight:600;color:#eef2f8;background:#1a2030;overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}

/* ---------- sfondo officina ---------- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#2a3140}
#stage>svg{width:100%;height:100%;display:block}
#stage .veil{position:absolute;inset:0;background:rgba(10,14,22,0);transition:background .55s,backdrop-filter .55s}
body[data-v=panel] #stage .veil{background:rgba(10,14,22,.66);backdrop-filter:blur(5px)}
body[data-v=title] #stage .veil{background:rgba(10,14,22,.38)}

/* ---------- pannelli (GT4 vetro/argento + contorno fumetto) ---------- */
.pn{position:relative;background:linear-gradient(180deg,rgba(48,63,88,.94),rgba(16,22,33,.96) 62%);border:3px solid var(--ink);border-radius:6px 22px 6px 22px;
box-shadow:0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.4),6px 6px 0 rgba(0,0,0,.5);overflow:hidden}
.pn::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.6px) 0 0/8px 8px}
.pn>*{position:relative}
.ph{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;background:linear-gradient(#f6f8fc,#b5bfcf 55%,#8f9bae);color:var(--ink);border-bottom:3px solid var(--ink);font:italic 800 17px var(--ff)}
.ph span{flex:1}.ph em{font-style:normal;font-weight:800;font-size:14px;background:var(--ink);color:#fff;padding:2px 10px;border-radius:10px}
.chip{width:26px;height:20px;background:var(--c,var(--red));border:3px solid var(--ink);transform:skewX(-14deg);flex:none}
.chip.cy{--c:var(--cy)}.chip.yl{--c:var(--yel)}.chip.li{--c:var(--lil)}

/* ---------- navigazione ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;gap:8px;padding:14px 20px;pointer-events:none}
.nav>div{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.tk{--c:var(--red);position:relative;font:italic 800 15px var(--ff);color:var(--ink);padding:9px 22px 8px;cursor:pointer;
background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0) 55%),var(--c);border:3px solid var(--ink);transform:skewX(-12deg);
box-shadow:4px 4px 0 rgba(0,0,0,.45);transition:transform .15s,filter .15s,box-shadow .15s}
.tk span{display:inline-block;transform:skewX(12deg)}
.tk.cy{--c:var(--cy)}.tk.yl{--c:var(--yel)}.tk.li{--c:var(--lil)}
.tk.red{color:#fff}.tk.red span{-webkit-text-stroke:.6px var(--ink);paint-order:stroke fill}
.nav .tk:not(.on){filter:saturate(.75) brightness(.86)}
.tk.on{transform:skewX(-12deg) translateY(-3px);box-shadow:0 0 0 2px #fff,5px 7px 0 rgba(0,0,0,.5)}
.tk:hover{filter:none;transform:skewX(-12deg) translateY(-2px)}
.dot{position:absolute;top:-9px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--red);border:3px solid var(--ink);transform:skewX(12deg)}
.menub{position:fixed;left:20px;bottom:18px;z-index:6}
.hud{position:fixed;right:20px;bottom:16px;z-index:6;width:min(330px,calc(100vw - 160px));padding:9px 14px 10px}
.hr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sil2)}
.hr b{color:#fff;font-weight:800}.hr span:first-child{color:#fff;font-weight:800}
.gauge{height:16px;margin:6px 0;background:#070a10;border:2px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
.gauge i{display:block;height:100%;transition:width .5s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 12px);mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 12px)}

/* ---------- home: garage ---------- */
.home{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:90px 16px 22px;cursor:pointer}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:center;width:max(320px,min(94vw,1060px,calc((100vh - 270px)*2.7)))}
.hero .cw{width:74%;flex:none}
.hero .own{width:15%;margin:0 2% 3% 0;flex:none}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:absolute;left:0;bottom:calc(100% - 30px);max-width:min(300px,58%);padding:12px 18px;background:#fff;color:var(--ink);border:4px solid var(--ink);
border-radius:50% 50% 50% 50%/62% 62% 38% 38%;font:italic 800 clamp(13px,1.6vw,17px)/1.2 var(--ff);text-align:center;box-shadow:5px 5px 0 rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:62%;bottom:-24px;width:26px;height:26px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:skewX(32deg) rotate(8deg) scaleY(.9);border-radius:0 0 8px 0}
.plate{margin-top:6px;padding:6px 26px;font:italic 800 16px var(--ff);color:#fff;background:linear-gradient(rgba(255,255,255,.18),rgba(0,0,0,.25)),var(--st2);border:3px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.3),4px 4px 0 rgba(0,0,0,.45);transform:skewX(-12deg)}
.plate span{display:inline-block;transform:skewX(12deg)}.plate em{font-style:normal;color:var(--cy);margin-left:10px}
.scroll{margin-top:16px;display:flex;flex-direction:column;align-items:center}
.sc-pl{padding:8px 24px;font:900 clamp(15px,2vw,20px) var(--fd);color:var(--ink);letter-spacing:.02em;background:
linear-gradient(rgba(11,14,21,.16) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(11,14,21,.16) 1px,transparent 1px) 0 0/12px 12px,var(--cy);
border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.5);transform:rotate(-2deg)}
.chev{display:block;margin-top:2px;width:28px;height:14px;animation:nudge 1.3s ease-in-out infinite}
.chev+.chev{margin-top:-6px;animation-delay:.15s}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}

/* ---------- schermate con pannelli ---------- */
.main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:88px 20px 130px;display:grid;grid-template-columns:1.08fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.col{display:grid;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.show{padding:10px 12px 0;background:radial-gradient(ellipse at 50% 92%,rgba(170,195,235,.5),transparent 62%)}
.show svg{width:100%;height:auto;display:block}
.show.lock .mk{pointer-events:none}
.mk{cursor:pointer}.mk:hover circle{stroke-width:6}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:4px 16px 12px}
.spec div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px}
.spec span{color:var(--sil2)}.spec b{font-weight:800}
.own{display:flex;gap:12px;padding:14px;align-items:center}
.av{width:56px;height:56px;flex:none;background:var(--cy);border:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.av::before{content:"";width:26px;height:26px;border-radius:50%;background:var(--ink);box-shadow:0 22px 0 8px var(--ink);margin-bottom:-4px;transform:translateY(-6px)}
.own b{font-size:17px;display:block}.own small{display:block;color:var(--sil2);font-size:13px}
.est{padding:12px 16px 14px}.est .big{font:italic 900 34px var(--fd);color:var(--yel);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);line-height:1.1}
.est small{display:block;color:var(--sil2);font-size:13px;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 60%);transition:background .15s}
.row:hover{background:linear-gradient(90deg,rgba(43,184,238,.3),transparent 85%)}
.n{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;font:900 14px var(--fd);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:50%}
.cb{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;font:900 18px var(--fd);background:#fff;color:var(--grn);border:3px solid var(--ink);-webkit-text-stroke:1px var(--ink)}
.t{flex:1;font-size:16px;font-weight:800}.t small{display:block;font-size:13px;color:var(--sil2);font-weight:600}
.empty{padding:22px 18px;color:var(--sil2);font-size:15px;line-height:1.4}
.tot{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;background:rgba(0,0,0,.22)}.tot b{color:var(--yel);font-weight:800}
.foot{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.18)}
.st{font:italic 800 12.5px var(--ff);padding:3px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);transform:skewX(-12deg)}
.st.bad{background:var(--red);color:#fff}.st.good{background:var(--grn)}.st.fix{background:var(--blu);color:#fff}
.btn{--c:var(--red);font:italic 800 15px var(--ff);padding:9px 22px;border:3px solid var(--ink);cursor:pointer;color:#fff;
background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 52%),var(--c);box-shadow:4px 4px 0 rgba(0,0,0,.5);transform:skewX(-10deg);
-webkit-text-stroke:.7px var(--ink);paint-order:stroke fill;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:skewX(-10deg) translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.btn.cy{--c:var(--cy)}.btn.ok{--c:var(--grn)}.btn.sm{font-size:13px;padding:6px 14px}.btn.big{font-size:21px;padding:12px 34px}
.btn:disabled{--c:#7b8494;cursor:not-allowed;box-shadow:none;opacity:.7;transform:skewX(-10deg)}
.msg{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.msg h4{margin:0 0 4px;font:italic 800 13px var(--ff);display:inline-block;padding:2px 12px;background:var(--lil);color:var(--ink);border:2px solid var(--ink);transform:skewX(-12deg)}
.msg.sys h4{background:var(--yel)}.msg p{margin:4px 0 0;font-size:15px;line-height:1.35}

/* ---------- titolo / risultati ---------- */
.ttl{position:relative;z-index:2;max-width:700px;margin:0 auto;padding:8vh 18px 40px;text-align:center}
.ttl .pn{padding:26px 26px 30px}
.logo{margin:0 0 14px;font:italic 900 clamp(34px,7vw,56px)/1 var(--fd);color:var(--yel);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:skewX(-6deg)}
.ttl p{font-size:16px;line-height:1.45;margin:10px auto;max-width:56ch}
.steps{text-align:left;max-width:52ch;margin:14px auto;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.35}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font:900 14px var(--fd);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:50%}
.keys{font-size:12.5px;color:var(--sil2);margin-top:12px;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:15px;margin:14px 0}
th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.2);text-align:left}th{color:var(--sil2);font-weight:700}td:last-child,th:last-child{text-align:right}
.stamp{display:inline-flex;flex-direction:column;align-items:flex-start;margin:8px 0 14px;transform:rotate(-3deg);animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp .s1{margin-left:-10px;padding:4px 18px;font:italic 800 20px var(--ff);color:#fff;background:var(--red);border:3px solid var(--ink);letter-spacing:.04em}
.stamp .s2{padding:2px 24px;font:italic 900 clamp(38px,9vw,60px)/1.1 var(--fd);color:var(--ink);background:var(--cy);border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.5);transform:skewX(-8deg)}
.stamp.bad .s1{background:var(--ink)}.stamp.bad .s2{background:var(--red);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes stamp{from{transform:rotate(-3deg) scale(2.3);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

/* ---------- modali (dado, menu) ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,14,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.md{text-align:center;width:min(460px,94vw);padding:0 0 20px}
.md .bd{padding:18px 20px 0}
.blob{display:inline-block;margin:0 0 14px;padding:16px 30px;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:58% 42% 55% 45%/48% 56% 44% 52%;box-shadow:5px 5px 0 rgba(0,0,0,.5);-webkit-text-stroke:.8px var(--ink);paint-order:stroke fill;transform:rotate(-2deg)}
.blob.rep{background:var(--cy);color:var(--ink);-webkit-text-stroke:0}
.blob b{display:block;font:italic 900 24px var(--fd)}.blob small{display:block;font-size:14px;font-weight:800}
.die{width:92px;height:92px;margin:0 auto;background:#fff;border:5px solid var(--ink);border-radius:16px;box-shadow:inset -9px -9px 0 #d4cdb8,6px 6px 0 rgba(0,0,0,.5);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px}
.die i{margin:3px}.die i.on{background:var(--ink);border-radius:50%}
.res{min-height:52px;font-size:16px;margin:14px 0;line-height:1.35}
.menulist{display:grid;gap:12px;padding:6px 24px 0;justify-items:center}
.help{font-size:13.5px;color:var(--sil2);line-height:1.5;padding:12px 24px 0;text-align:left}

@media(max-width:600px){.nav{padding:10px}.tk{padding:8px 13px 7px;font-size:13px}.menub{left:10px;bottom:12px}.hud{right:10px;bottom:10px}.main{padding-top:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body data-v="title">
<div id="stage"></div>
<div id="app"></div><div id="menu"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);

/* ======================= DATI ======================= */
const PARTS=[{n:'Motore',h:2,x:490,y:150},{n:'Batteria',h:1,x:415,y:160},{n:'Fari',h:1,x:548,y:170},{n:'Freni',h:1,x:470,y:208},{n:'Gomme',h:1,x:140,y:208},{n:'Sospensioni',h:2,x:305,y:216},{n:'Marmitta',h:1,x:62,y:186}];
const CARS=[
{m:'Fiat Panda',y:1998,km:212430,f:'Benzina',c:'#ffd23f',lim:13,n:3,own:{nome:'Paolo Muro',eta:33,job:'Tecnico',dest:'Città del Capo'},
 say:'Ripara la mia auto, che devo scappare!!!',note:'Il proprietario ha due gatti sul sedile e nessuna voglia di aspettare.'},
{m:'Alfa Romeo 147',y:2004,km:187900,f:'Diesel',c:'#e8372c',lim:15,n:4,own:{nome:'Giulia Ferrante',eta:41,job:'Infermiera',dest:'Durban'},
 say:'I cancelli chiudono all\'alba! Sbrigati!',note:'«I cancelli della città chiudono all\'alba. Fai in fretta.»'},
{m:'Land Rover Defender',y:2001,km:305120,f:'Diesel',c:'#43b86a',lim:17,n:5,own:{nome:'Marco Benedetti',eta:52,job:'Guida alpina',dest:'Windhoek'},
 say:'Il bagagliaio è pieno di scatolette. Muoviti!',note:'Bagagliaio pieno di scatolette. Il tizio guarda fuori dalla finestra ogni minuto.'}];
const FACES=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
let G={screen:'menu'};
const cur=()=>G.cars[G.i];
const fmt=x=>(+x).toFixed(1).replace('.0','').replace('.',',');

/* ======================= LOGICA ======================= */
function newGame(){
 G={screen:'game',i:0,phase:0,tab:'home',menuOpen:false,log:[],logN:0,seenN:0,roll:null,timeout:false,res:[],
 cars:CARS.map(c=>{const ids=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,c.n);
  return{...c,left:c.lim,st:PARTS.map((p,k)=>({insp:false,fault:ids.includes(k),has:false,fixed:false}))}})};
 log('Entra la prima auto. Il proprietario è nervoso.');closeMenu();render();
}
function log(t){G.log.unshift(t);G.log=G.log.slice(0,8);G.logN++}
function spend(h){const c=cur();c.left=Math.max(0,+(c.left-h).toFixed(1));if(c.left<=0)G.timeout=true}
function lose(why){G.screen='end';G.win=false;G.why=why;render()}
function setTab(t){if(G.screen!=='game'||G.roll)return;G.tab=t;if(typeof t==='number')G.phase=t;if(t==='msg')G.seenN=G.logN;render();scrollTo(0,0)}
function act(k){
 if(G.screen!=='game'||G.roll||G.tab!==G.phase)return;const c=cur(),s=c.st[k],p=PARTS[k];
 if(G.phase===0){if(s.insp)return;s.insp=true; /* l'ispezione non consuma più tempo */
  log(s.fault?`${p.n}: GUASTO! Riparazione stimata ${p.h}h.`:`${p.n}: tutto a posto.`);render()}
 else if(G.phase===1){if(s.insp&&s.fault&&!s.has&&!s.fixed)openRoll('buy',k)}
 else if(s.has&&!s.fixed)openRoll('rep',k);
}
function openRoll(kind,k){G.roll={kind,k,v:0,done:false,rolling:false,txt:''};showRoll()}
function dieHTML(n){return'<div class="die">'+[...Array(9)].map((_,i)=>`<i class="${FACES[n].includes(i)?'on':''}"></i>`).join('')+'</div>'}
function showRoll(){const r=G.roll;if(!r){$('#modal').innerHTML='';return}
 const p=PARTS[r.k],buy=r.kind==='buy';
 $('#modal').innerHTML=`<div class="ov"><div class="pn md"><div class="ph"><i class="chip ${buy?'':'yl'}"></i><span>${p.n}</span></div><div class="bd">
 <div class="blob ${buy?'':'rep'}"><b>${buy?'TEST PREDONI':'RIPARA'}</b><small>${buy?'Tira il dado (d6)':'Tira il dado e ripara'}</small></div>
 <div id="dz">${dieHTML(r.v||6)}</div><div class="res">${r.txt||(buy?'Riuscirai a passare tra i predoni?':'Le mani sporche di olio. Si monta!')}</div>
 <button class="btn big" onclick="rollKey()">${r.done?'Continua':'Tira il d6'}</button>
 <div class="keys">${buy?'1-2: i predoni rubano il pezzo (-1h) · 3-6: acquisto riuscito (-1h)':'1-2: imprevisto, +1h e ricambio perso · 3-5: riparato · 6: colpo di genio, -1h'}<br>Spazio o Invio per tirare</div></div></div></div>`}
function rollKey(){const r=G.roll;if(!r||r.rolling)return;
 if(r.done){G.roll=null;showRoll();if(G.timeout)return lose('Il tempo è finito: il proprietario è scappato a piedi.');return render()}
 r.rolling=true;let t=0;const iv=setInterval(()=>{$('#dz').innerHTML=dieHTML(1+rnd(6));
  if(++t>10){clearInterval(iv);r.rolling=false;r.v=1+rnd(6);resolve();showRoll()}},70)}
function resolve(){const r=G.roll,c=cur(),s=c.st[r.k],p=PARTS[r.k],d=r.v;r.done=true;
 if(r.kind==='buy'){spend(1);
  if(d<=2){r.txt=`Hai fatto ${d}: i predoni ti rubano il ${p.n.toLowerCase()}! Perdi 1h, dovrai riprovare.`}
  else{s.has=true;r.txt=`Hai fatto ${d}: ricambio in tasca! (-1h)`}}
 else{
  if(d<=2){spend(p.h+1);s.has=false;r.txt=`Hai fatto ${d}: imprevisto! +1h di malus e ricambio perso (${fmt(p.h+1)}h totali).`}
  else if(d<=5){spend(p.h);s.fixed=true;r.txt=`Hai fatto ${d}: riparazione riuscita in ${fmt(p.h)}h.`}
  else{const h=Math.max(0,p.h-1);spend(h);s.fixed=true;r.txt=`Hai fatto 6: colpo di genio! Finito in ${fmt(h)}h.`}}
 log(r.txt);}
function deliver(){const c=cur();if(G.screen!=='game'||G.roll)return;
 const allFixed=c.st.every(s=>!s.fault||s.fixed);
 if(!allFixed)return lose('Revisione bocciata: avevi lasciato guasti non trovati. Il proprietario è partito comunque… e non è arrivato lontano.');
 G.res.push({m:c.m,left:c.left});G.screen='inter';render()}
function next(){if(G.i+1>=G.cars.length){G.screen='end';G.win=true;return render()}

function nav(){
 const T=(id,label,cls)=>{const a=typeof id==='number'?id:`'${id}'`;
  return`<button class="tk ${cls} ${G.tab===id?'on':''}" onclick="setTab(${a})"><span>${label}</span>${id==='msg'&&G.logN>G.seenN&&G.tab!=='msg'?'<i class="dot"></i>':''}</button>`};
 return`<nav class="nav"><div>${T(0,'Scheda veicolo','')}${T(1,'Ricambi','cy')}${T(2,'Officina','yl')}</div><div>${T('msg','Messaggi','li')}</div></nav>`}
function hud(c){const pct=c.left/c.lim*100,col=pct>50?'#35c777':pct>25?'#ffd23f':'#e8372c';
 return`<div class="hud pn"><div class="hr"><span>Auto ${G.i+1}/${G.cars.length}</span><span>${c.m}</span></div><div class="gauge"><i style="width:${pct}%;background:${col}"></i></div><div class="hr"><span style="color:var(--sil2);font-weight:600">Tempo residuo</span><b>${fmt(c.left)}h / ${c.lim}h</b></div></div>`}
const menuBtn='<button class="tk red menub" onclick="openMenu()"><span>Menù</span></button>';
const pill=(s)=>`<span class="st ${s.fixed?'fix':s.fault?'bad':'good'}">${s.fixed?'RIPARATO':s.fault?'GUASTO':'OK'}</span>`;

function render(){
 const A=$('#app');
 document.body.dataset.v=G.screen==='game'?(G.tab==='home'?'home':'panel'):(G.screen==='menu'?'title':'title');

 if(G.screen==='menu'){A.innerHTML=`<div class="ttl"><div class="pn"><h1 class="logo">REVISIONE<br>APOCALITTICA</h1>
 <p>Una pandemia sta facendo crollare tutto. Sei l'ultimo meccanico ancora aperto e la fila di chi scappa si allunga.</p>
 <ol class="steps"><li>Apri la scheda veicolo e ispeziona i pezzi: il controllo non costa tempo.</li><li>Compra i ricambi senza farteli rubare dai predoni.</li><li>Ripara ogni guasto in officina: i dadi decidono tra colpo di genio e disastro.</li></ol>
 <p>Finisci prima che il proprietario scappi. Tre auto in coda.</p><button class="btn big" onclick="newGame()">Inizia</button><div class="keys">Premi Invio per iniziare</div></div></div>`+menuBtn;return}

 if(G.screen==='inter'){const r=G.res[G.res.length-1];A.innerHTML=`<div class="ttl"><div class="pn"><div class="stamp"><span class="s1">REVISIONE</span><span class="s2">PASSATA</span></div>
 <p>Hai riparato la macchina in tempo. ${r.m}: timbro sul libretto con ${fmt(r.left)}h di anticipo. Il proprietario parte sgommando.</p><button class="btn big ok" onclick="next()">Prossima auto</button><div class="keys">Premi Invio per continuare</div></div></div>`+menuBtn;return}

 if(G.screen==='end'){A.innerHTML=(G.win?`<div class="ttl"><div class="pn"><h1 class="logo">FATTO!</h1><p>Tutte le auto in coda hanno passato la revisione. Poi spegni le luci e chiudi l'officina.</p>
 <table><tr><th>Auto</th><th>Ore avanzate</th></tr>${G.res.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.left)}h</td></tr>`).join('')}</table><button class="btn big" onclick="newGame()">Rigioca</button><div class="keys">Premi Invio per rigiocare</div></div></div>`
 :`<div class="ttl"><div class="pn"><div class="stamp bad"><span class="s1">REVISIONE</span><span class="s2">FALLITA</span></div><p>${G.why}</p><p>Il cliente è scappato a piedi. Auto superate: ${G.res.length} su ${CARS.length}.</p><button class="btn big" onclick="newGame()">Rigioca</button><div class="keys">Premi Invio per rigiocare</div></div></div>`)+menuBtn;return}

 const c=cur(),o=c.own;
 /* ---------- garage (home) ---------- */
 if(G.tab==='home'){
  A.innerHTML=nav()+`<div class="home" onclick="setTab(0)"><div class="hero"><div class="bubble">${c.say}</div><div class="own">${figSVG()}</div><div class="cw">${carSVG(c,'home')}</div></div>
  <div class="plate"><span>${c.m}<em>${c.y}</em></span></div>
  <div class="scroll"><div class="sc-pl">SCORRI PER INIZIARE</div><svg class="chev" viewBox="0 0 28 14"><path d="M2 2l12 10L26 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="chev" viewBox="0 0 28 14"><path d="M2 2l12 10L26 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`+menuBtn+hud(c);return}

 /* ---------- schede ---------- */
 const done=c.st.filter(s=>s.insp).length,allFixed=c.st.every(s=>!s.fault||s.fixed),anyFix=c.st.some(s=>s.fixed);
 const known=PARTS.map((p,k)=>({p,k,s:c.st[k]})).filter(x=>x.s.insp&&x.s.fault);
 const todo=known.filter(x=>!x.s.fixed);
 const estH=todo.reduce((a,x)=>a+x.p.h+(x.s.has?0:1),0),toBuy=todo.filter(x=>!x.s.has).length,workH=todo.reduce((a,x)=>a+x.p.h,0);

 const left=`<div class="col"><section class="pn"><header class="ph"><i class="chip"></i><span>${c.m}</span><em>${c.y}</em></header>
 <div class="show ${G.tab==='msg'?'lock':''}">${carSVG(c,'tab')}</div>
 <div class="spec"><div><span>Km</span><b>${c.km.toLocaleString('it-IT')}</b></div><div><span>Carburante</span><b>${c.f}</b></div><div><span>Ispezionati</span><b>${done}/7</b></div><div><span>Guasti noti</span><b>${known.length}</b></div></div></section>
 <div class="two"><section class="pn"><header class="ph"><i class="chip cy"></i><span>Proprietario</span></header><div class="own"><div class="av"></div><div><b>${o.nome}</b><small>${o.eta} anni · ${o.job}</small><small>Destinazione: ${o.dest}</small></div></div></section>
 <section class="pn"><header class="ph"><i class="chip yl"></i><span>Stima lavori</span></header><div class="est"><div class="big">${known.length?fmt(estH)+'h':'—'}</div><small>${known.length?`${toBuy} ricambi da comprare`:'Ispeziona i pezzi per la stima'}${done<7&&known.length?` · ${7-done} pezzi da controllare`:''}</small></div></section></div></div>`;

 let title,chip,body,foot='';
 if(G.tab===0){title='Scheda veicolo · Resoconto check';chip='';
  body=PARTS.map((p,k)=>{const s=c.st[k];const sub=s.insp?(s.fault?`Guasto · riparazione ${fmt(p.h)}h`:'Nessun problema'):'Non ispezionato';
   return`<div class="row"><div class="n">${k+1}</div><div class="t">${p.n}<small>${sub}</small></div>${s.insp?pill(s):`<button class="btn sm" onclick="act(${k})">Ispeziona</button>`}</div>`}).join('');
  foot=`<button class="btn cy" onclick="setTab(1)">Vai ai ricambi</button><button class="btn" onclick="setTab(2)">Ripara</button>`}
 else if(G.tab===1){title='Mercato ricambi';chip='cy';
  body=known.length?known.map(({p,k,s})=>`<div class="row"><div class="n">${k+1}</div><div class="t">${p.n}<small>Montaggio ${fmt(p.h)}h</small></div>${s.fixed?'<span class="st fix">RIPARATO</span>':s.has?'<span class="st good">RICAMBIO OK</span>':`<button class="btn sm" onclick="act(${k})">Compra · 1h</button>`}</div>`).join('')
   :'<div class="empty">Nessun guasto noto. Torna alla scheda veicolo e ispeziona i pezzi.</div>';
  foot=`<button class="btn cy" onclick="setTab(0)">Scheda veicolo</button><button class="btn" style="--c:var(--yel);color:var(--ink);-webkit-text-stroke:0" onclick="setTab(2)">Officina</button>`}
 else if(G.tab===2){title='Officina · Seleziona intervento';chip='yl';
  body=(known.length?known.map(({p,k,s})=>`<div class="row"><div class="cb">${s.fixed?'✓':''}</div><div class="t">${p.n}<small>Costo ${fmt(p.h)}h</small></div>${s.fixed?'<span class="st fix">RIPARATO</span>':s.has?`<button class="btn sm ok" onclick="act(${k})">Monta · ${fmt(p.h)}h</button>`:'<span class="st bad">SERVE RICAMBIO</span>'}</div>`).join('')
   :'<div class="empty">Nessun guasto noto. Torna alla scheda veicolo e ispeziona i pezzi.</div>')+
   (known.length?`<div class="tot"><span>Totale lavori</span><b>${fmt(workH)}h / ${fmt(c.left)}h</b></div>`:'');
  foot=`<button class="btn cy" onclick="setTab(1)">Ricambi</button><button class="btn ok" ${anyFix&&allFixed?'':'disabled'} onclick="deliver()">Consegna auto</button>`}
 else{title='Messaggi';chip='li';
  body=`<div class="msg"><h4>${o.nome}</h4><p>${c.note}</p></div>`+G.log.map(l=>`<div class="msg sys"><h4>Officina</h4><p>${l}</p></div>`).join('')}

 A.innerHTML=nav()+`<div class="main">${left}<section class="pn"><header class="ph"><i class="chip ${chip}"></i><span>${title}</span></header>${body}${foot?`<div class="foot">${foot}</div>`:''}</section></div>`+menuBtn+hud(c);
}

/* ======================= INPUT ======================= */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='escape'){if(G.menuOpen)closeMenu();else openMenu();return}
 if(G.menuOpen)return;
 if(G.roll){if(k===' '||k==='enter'){e.preventDefault();rollKey()}return}
 if(G.screen==='menu'||G.screen==='end'){if(k==='enter')newGame();return}
 if(G.screen==='inter'){if(k==='enter')next();return}
 if(G.tab==='home'){if(k==='enter'||k===' '||k==='arrowdown'){e.preventDefault();setTab(0)}else if(k==='c'||k==='m'||k==='o')setTab('cmo'.indexOf(k));return}
 if(k==='c'||k==='m'||k==='o')setTab('cmo'.indexOf(k));
 else if(k==='h')setTab('home');
 else if(k==='d')deliver();
 else if(/^[1-7]$/.test(k))act(+k-1)});
let wheelLock=0,ty=null;
addEventListener('wheel',e=>{if(G.screen==='game'&&G.tab==='home'&&!G.roll&&!G.menuOpen&&e.deltaY>10&&Date.now()>wheelLock){wheelLock=Date.now()+600;setTab(0)}},{passive:true});
addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(ty!==null&&G.screen==='game'&&G.tab==='home'&&!G.roll&&!G.menuOpen&&ty-e.changedTouches[0].clientY>40)setTab(0);ty=null},{passive:true});

$('#stage').innerHTML=bgSVG()+'<div class="veil"></div>';
render();
</script></body></html>
